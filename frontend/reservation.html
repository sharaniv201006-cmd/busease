
                    <div class="legend-dot disabled"></div>
                    <span>Disabled</span>
                </div>
            </div>
            <!-- Bus Seat Layout -->
            <div class="bus-layout">
                <div class="bus-front">
                    <i class="fa-solid fa-dharmachakra steering"></i>
                    <p>Driver Cabin</p>
                </div>
                <div class="seat-grid" id="seatGrid"></div>
            </div>
            <!-- Action -->
            <div class="reservation-actions">
                <button class="btn btn-primary" id="confirmBtn" disabled onclick="confirmReservation()">Confirm Reservation</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/reservation.js"></script>
</body>
