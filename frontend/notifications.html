<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Center - BusEase</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="sticky-navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <i class="fas fa-bus-alt"></i>
        <div>Bus<span class="highlight">Ease</span></div>
      </a>

      <ul class="nav-links">
        <li><a href="student.html">Dashboard</a></li>
        <li><a href="bookings.html">My Bookings</a></li>
        <li><a href="notifications.html" class="active">Notifications</a></li>
      </ul>

      <div class="nav-actions">
        <a href="student.html" class="btn-busease-secondary">
          <i class="fas fa-arrow-left me-1"></i> Dashboard
        </a>
      </div>
    </div>
  </header>

  <div style="max-width: 900px; margin: 40px auto; padding: 0 24px;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px;">
      <div>
        <h1 style="font-size: 2rem; margin-bottom: 4px;"><i class="fas fa-bell text-orange me-2"></i> Notification Center</h1>
        <p style="color: var(--text-muted);">Real-time alerts, gate entries, journey updates, and emergency dispatches</p>
      </div>
      <button type="button" class="btn-busease-secondary" onclick="clearAllNotifications()">
        <i class="fas fa-check-double me-1"></i> Clear All
      </button>
    </div>

    <!-- NOTIFICATIONS LIST -->
    <div id="notificationsList" style="display: flex; flex-direction: column; gap: 16px;">
      <!-- Populated by JS -->
    </div>

  </div>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNotifications();
    });

    function renderNotifications() {
      const notifications = BusEaseState.getNotifications();
      const container = document.getElementById('notificationsList');

      if (notifications.length === 0) {
        container.innerHTML = `
          <div class="glass-card" style="padding: 40px; text-align: center; color: var(--text-muted);">
            <i class="fas fa-bell-slash" style="font-size: 2.5rem; margin-bottom: 12px; opacity: 0.4;"></i>
            <p>No notifications available.</p>
          </div>
        `;
        return;
      }

      const typeMap = {
        success: { icon: 'fa-check-circle', color: '#10b981', bg: 'rgba(16,185,129,0.15)', border: 'rgba(16,185,129,0.3)' },
        emergency: { icon: 'fa-triangle-exclamation', color: '#f87171', bg: 'rgba(239,68,68,0.15)', border: '#f87171' },
        info: { icon: 'fa-info-circle', color: '#60a5fa', bg: 'rgba(59,130,246,0.15)', border: 'rgba(59,130,246,0.3)' }
      };

      container.innerHTML = notifications.map(n => {
        const style = typeMap[n.type] || typeMap.info;
        return `
          <div class="glass-card" style="padding: 20px; border-left: 4px solid ${style.color}; display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 16px;">
              <div style="width: 42px; height: 42px; border-radius: 50%; background: ${style.bg}; color: ${style.color}; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
                <i class="fas ${style.icon}"></i>
              </div>
              <div>
                <div style="font-weight: 700; font-size: 1.05rem; margin-bottom: 2px;">${n.title}</div>
                <div style="color: var(--text-muted); font-size: 0.9rem;">${n.message}</div>
              </div>
            </div>
            <div style="font-size: 0.75rem; color: var(--text-muted); text-align: right;">
              ${n.time || 'Just now'}
            </div>
          </div>
        `;
      }).join('');
    }

    function clearAllNotifications() {
      localStorage.setItem(BUSEASE_STORAGE_KEYS.NOTIFICATIONS, JSON.stringify([]));
      renderNotifications();
      showToast('Notifications cleared', 'info');
    }
  </script>
</body>
</html>
